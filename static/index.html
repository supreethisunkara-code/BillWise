<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BillWise - Local Chat</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #111; color: #eee; margin: 0; }
  #chat { max-width: 480px; margin: 0 auto; padding: 20px; height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; }
  h2 { text-align: center; color: #25D366; }
  #messages { flex: 1; overflow-y: auto; padding: 10px; }
  .msg { padding: 10px 14px; border-radius: 12px; margin: 6px 0; max-width: 80%; white-space: pre-wrap; }
  .bot { background: #222; align-self: flex-start; }
  .user { background: #005c4b; align-self: flex-end; margin-left: auto; }
  #inputRow { display: flex; gap: 8px; padding-top: 10px; }
  #textInput { flex: 1; padding: 10px; border-radius: 8px; border: none; }
  button, label.filebtn { background: #25D366; color: #000; border: none; padding: 10px 14px; border-radius: 8px; cursor: pointer; }
  #fileInput { display: none; }
</style>
</head>
<body>
<div id="chat">
  <h2>BillWise (local)</h2>
  <div id="messages"></div>
  <div id="inputRow">
    <label class="filebtn" for="fileInput">📎</label>
    <input type="file" id="fileInput" accept="image/*,application/pdf">
    <input type="text" id="textInput" placeholder="Type a message...">
    <button onclick="sendText()">Send</button>
  </div>
</div>

<script>
const userId = "local-user-1"; // stand-in for a WhatsApp phone number
const messagesEl = document.getElementById("messages");

function addMessage(text, sender) {
  const div = document.createElement("div");
  div.className = "msg " + sender;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

// Kick off the conversation the same way a fresh WhatsApp chat would
addMessage("Hi! Send me a clear photo or PDF of your hospital bill and I'll break it down for you.", "bot");

async function sendText() {
  const input = document.getElementById("textInput");
  const text = input.value.trim();
  if (!text) return;
  addMessage(text, "user");
  input.value = "";

  const form = new FormData();
  form.append("user_id", userId);
  form.append("text", text);

  const resp = await fetch("/chat/text", { method: "POST", body: form });
  const data = await resp.json();
  addMessage(data.reply, "bot");
}

document.getElementById("fileInput").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  addMessage("📎 " + file.name, "user");

  const form = new FormData();
  form.append("user_id", userId);
  form.append("file", file);

  addMessage("Reading your bill...", "bot");
  const resp = await fetch("/chat/upload", { method: "POST", body: form });
  const data = await resp.json();
  // Replace the "Reading..." placeholder with the real reply
  messagesEl.lastChild.textContent = data.reply;
});

document.getElementById("textInput").addEventListener("keypress", (e) => {
  if (e.key === "Enter") sendText();
});
</script>
</body>
</html>
